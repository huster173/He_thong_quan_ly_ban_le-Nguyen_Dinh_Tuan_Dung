spring.application.name=order-inventory-system
server.port=8080


spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:shop}
spring.datasource.password=${DB_PASSWORD:shop}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000

server.error.include-message=always

# Swagger UI: http://localhost:8080/swagger-ui.html
# Khong dat operations-sorter de cac endpoint giu nguyen thu tu khai bao trong
# controller -- Phan 1 -> Phan 2 -> Phan 3, dung mach trinh bay cua de bai.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.api-docs.path=/v3/api-docs
